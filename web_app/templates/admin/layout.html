<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理员后台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-shell">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div>
                <div class="admin-brand">
                    <div class="admin-brand-icon">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <div>
                        <div class="admin-brand-title">管理员后台</div>
                        <div class="admin-brand-subtitle">root / root</div>
                    </div>
                </div>
                <nav class="admin-nav">
                    <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-link">
                        <i class="fas fa-chart-line"></i><span>总览</span>
                    </a>
                    <a href="{{ url_for('admin.users') }}" class="admin-nav-link">
                        <i class="fas fa-users"></i><span>用户</span>
                    </a>
                    <a href="{{ url_for('admin.operations') }}" class="admin-nav-link">
                        <i class="fas fa-list-check"></i><span>操作记录</span>
                    </a>
                </nav>
            </div>
            <div class="admin-sidebar-footer">
                <a href="{{ url_for('admin.logout') }}" class="btn btn-outline-light w-100">
                    <i class="fas fa-right-from-bracket me-2"></i> 退出后台
                </a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div>
                    <h1 class="admin-page-title mb-1">{% block page_title %}控制台{% endblock %}</h1>
                    <p class="text-muted mb-0">{% block page_subtitle %}用户、查询、操作一屏管理{% endblock %}</p>
                </div>
                <div class="admin-topbar-actions">
                    <span class="admin-chip">root</span>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-arrow-left me-1"></i> 返回系统
                    </a>
                </div>
            </header>

            <div class="admin-content container-fluid py-4">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
