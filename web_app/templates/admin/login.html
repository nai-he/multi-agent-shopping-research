<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - Multi-Agent 购物调研系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-body">
    <div class="admin-login-shell">
        <div class="admin-login-card">
            <div class="admin-login-badge">
                <i class="fas fa-shield-halved"></i>
                <span>管理员专用</span>
            </div>
            <h1>管理员登录</h1>
            <p class="text-muted">固定账号为 root，密码为 root。</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2">
                            <i class="fas fa-circle-info me-2"></i>{{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="mb-3">
                    <label class="form-label" for="username">账号</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" value="root" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" value="root" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-lock-open me-2"></i> 登录后台
                </button>
            </form>

            <div class="admin-login-hint">
                <span>不提供注册入口</span>
                <a href="{{ url_for('auth.login') }}">返回普通登录</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</body>
</html>
