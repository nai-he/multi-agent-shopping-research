{% extends "layout.html" %}

{% block title %}500 - 服务器错误{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-template">
                <h1 class="display-1 text-danger">500</h1>
                <h2 class="mb-4">服务器内部错误</h2>
                <div class="error-details mb-4">
                    <p class="text-muted">抱歉，服务器遇到了一个错误，无法完成您的请求。</p>
                    <p class="text-muted">我们的技术团队已经收到通知，正在处理这个问题。</p>
                </div>
                <div class="error-actions">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door"></i> 返回首页
                    </a>
                    <a href="javascript:location.reload()" class="btn btn-outline-secondary btn-lg ms-2">
                        <i class="bi bi-arrow-clockwise"></i> 重新加载
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-template {
    padding: 40px 15px;
}
.error-template h1 {
    font-size: 8rem;
    font-weight: bold;
}
</style>
{% endblock %}
