{% extends "layout.html" %}

{% block title %}404 - 页面未找到{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-template">
                <h1 class="display-1 text-primary">404</h1>
                <h2 class="mb-4">页面未找到</h2>
                <div class="error-details mb-4">
                    <p class="text-muted">抱歉，您访问的页面不存在或已被删除。</p>
                </div>
                <div class="error-actions">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door"></i> 返回首页
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg ms-2">
                        <i class="bi bi-arrow-left"></i> 返回上一页
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-template {
    padding: 40px 15px;
}
.error-template h1 {
    font-size: 8rem;
    font-weight: bold;
}
</style>
{% endblock %}
